services:
  formfling:
    image: ghcr.io/mtthw/formfling:${IMAGE_TAG:-main}
    # To build from this checkout instead, replace image with: build: .
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      FROM_EMAIL: ${FROM_EMAIL:?Set FROM_EMAIL in .env}
      TO_EMAIL: ${TO_EMAIL:?Set TO_EMAIL in .env}
      TO_NAME: ${TO_NAME:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      STATUS_REDIRECT_URL: ${STATUS_REDIRECT_URL:?Set STATUS_REDIRECT_URL to your contact page in .env}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      RATE_LIMIT_MAX_EMAILS: ${RATE_LIMIT_MAX_EMAILS:-3}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-24h}
      EXPOSE_VERSION: ${EXPOSE_VERSION:-true}
      PORT: ${PORT:-8080}
      TZ: ${TZ:-UTC}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:$${PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
